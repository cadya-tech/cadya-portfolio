    <script>
        // Countdown Timer
        function updateCountdown() {
            const daysElement = document.getElementById('days');
            const hoursElement = document.getElementById('hours');
            const minutesElement = document.getElementById('minutes');
            const secondsElement = document.getElementById('seconds');

            // Set your launch date here (YYYY, MM-1, DD, HH, MM, SS)
            const launchDate = new Date(2025, 5, 15, 0, 0, 0).getTime();
            const now = new Date().getTime();
            const timeLeft = launchDate - now;

            if (timeLeft > 0) {
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                daysElement.textContent = days.toString().padStart(2, '0');
                hoursElement.textContent = hours.toString().padStart(2, '0');
                minutesElement.textContent = minutes.toString().padStart(2, '0');
                secondsElement.textContent = seconds.toString().padStart(2, '0');
            } else {
                // Countdown finished
                daysElement.textContent = '00';
                hoursElement.textContent = '00';
                minutesElement.textContent = '00';
                secondsElement.textContent = '00';
            }
        }

        // Update countdown every second
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call

        // Form submission
        document.querySelector('.notify-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = this.querySelector('.notify-input').value;
            alert(`Thank you! We'll notify you at ${email} when we launch.`);
            this.querySelector('.notify-input').value = '';
        });

        // Navigation menu toggle
        const navMenu = document.getElementById("nav-menu"),
            navToggle = document.getElementById("nav-toggle"),
            navLinks = document.querySelectorAll(".nav__link");

        // Open / close menu
        navToggle.addEventListener("click", () => {
            navMenu.classList.toggle("show");
        });

        // Close menu when clicking a link
        navLinks.forEach(link =>
            link.addEventListener("click", () => {
                navMenu.classList.remove("show");
            })
        );
    </script>
