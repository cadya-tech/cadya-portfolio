    <style>
        .page-header {
            text-align: center;
            margin-top: 100px;
            color: #22133b;
            max-width: 90%;


        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--first-color, #623bff);
        }

        .page-header p {
            margin-top: 0.5rem;
            font-size: 1.2rem;
            opacity: 0.8;
            text-align: center;

        }


        .gallery {
            background: linear-gradient(180deg, #fafaff 0%, #ffffff 100%);
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 100px;

            height: 700px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .column img {
            width: 300px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .column img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .column a {
            position: relative;
            text-decoration: none;
            display: block;
        }

        .column p {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background-color: rgba(78, 20, 238, 0.4);
            margin: 0;
            padding: 8px;
            border-radius: 0 0 8px 8px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .column a:hover {
            transform: scale(1.07);
            transition: transform 0.3s;
        }

        .column a:hover p {
            background-color: rgba(78, 20, 238, 0.6);
            transition: background-color 0.3s;
        }

        @media screen and (max-width: 768px) {
            .gallery {
                flex-direction: column;
                align-items: center;
                height: auto;
            }

            .page-header p {
                font-size: 1rem;
                text-align: center;
                margin: auto;
            }

            .column {
                width: 100%;
                max-width: 400px;
            }

            .column img {
                width: 100%;
            }

        }
    </style>
</head>

    <!--===== MAIN JS =====-->
    <script src="assets/js/main.js"></script>

    <script>
        const navMenu = document.getElementById("nav-menu"),
            navToggle = document.getElementById("nav-toggle"),
            navLinks = document.querySelectorAll(".nav__link");

        // Open / close menu
        navToggle.addEventListener("click", () => {
            navMenu.classList.toggle("show");
        });

        // Close menu when clicking a link
        navLinks.forEach(link =>
            link.addEventListener("click", () => {
                navMenu.classList.remove("show");
            })
        );
    </script>
